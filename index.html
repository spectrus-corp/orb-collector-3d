<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Orb Collector 3D</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:system-ui,sans-serif;color:#e0e0ff;user-select:none;touch-action:none;position:fixed;inset:0}#ui{position:absolute;top:0;left:0;right:0;padding:12px 14px;display:flex;gap:8px;z-index:10;pointer-events:none;flex-wrap:wrap;max-width:calc(100% - 60px)}.stat{background:linear-gradient(145deg,rgba(25,22,50,.88),rgba(15,12,35,.92));border:1px solid rgba(139,92,246,.4);border-radius:14px;padding:9px 14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.45)}.stat span{color:#c4b5fd}#shop-btn,#mute-btn{pointer-events:auto;cursor:pointer}#shop-btn{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border:1px solid rgba(167,139,250,.5);border-radius:14px;padding:9px 16px;font-weight:700}#mute-btn{position:absolute;top:12px;right:12px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid rgba(167,139,250,.45);background:rgba(20,20,40,.85);color:#e0e0ff;font-size:1.2rem;display:none;align-items:center;justify-content:center}#mute-btn.visible{display:flex}#overlay{position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(124,58,237,.25),transparent 55%),radial-gradient(ellipse at center,rgba(15,10,40,.94),rgba(5,5,15,.98));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30}#overlay.hidden{opacity:0;pointer-events:none}#overlay h1{font-size:2rem;background:linear-gradient(135deg,#c4b5fd,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}#start-btn,#restart-btn{background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:#fff;border:none;border-radius:16px;padding:15px 40px;font-size:1.1rem;font-weight:700;cursor:pointer;pointer-events:auto}#game-over{display:none}#game-over.visible{display:flex;flex-direction:column;align-items:center}#shop-overlay{position:absolute;inset:0;background:rgba(5,5,15,.92);z-index:40;display:none;flex-direction:column;align-items:center;padding:16px;overflow-y:auto}#shop-overlay.open{display:flex}#instructions{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(15,12,35,.9);border:1px solid rgba(139,92,246,.45);border-radius:16px;padding:10px 16px;z-index:10;pointer-events:none}#mobile-controls{display:none}.shop-card{background:rgba(22,22,45,.92);border:1px solid rgba(120,100,255,.3);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:140px}#shop-items{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}#shop-header{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#shop-meta{width:100%;max-width:520px;display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.pill{background:rgba(20,20,40,.85);border:1px solid rgba(120,100,255,.35);border-radius:10px;padding:6px 12px}.pill span{color:#a78bfa;font-weight:700}.rarity{font-size:.7rem;font-weight:800;text-transform:uppercase;padding:2px 8px;border-radius:6px}.rarity-common{background:rgba(156,163,175,.25);color:#d1d5db}.rarity-rare{background:rgba(59,130,246,.25);color:#93c5fd}.rarity-epic{background:rgba(168,85,247,.3);color:#d8b4fe}.rarity-legendary{background:rgba(245,158,11,.3);color:#fcd34d}.shop-card button{margin-top:auto;width:100%;border:none;border-radius:10px;padding:8px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff}.shop-card button:disabled{opacity:.45}</style></head><body><div id="canvas-container"><button id="mute-btn" type="button">🔊</button><div id="ui"><div class="stat">Score : <span id="score">0</span></div><div class="stat">Temps : <span id="time">60</span>s</div><div class="stat">Orbes : <span id="orbs">0</span></div><div class="stat">Banque : <span id="total-orbs">0</span></div><button id="shop-btn" type="button">Boutique</button></div><div id="instructions">Z Q S D · Espace sauter</div><div id="mobile-controls"></div></div><div id="overlay"><div id="start-screen"><h1>Orb Collector 3D</h1><p>Collectez les orbes. Évitez les obstacles.</p><button id="start-btn">Jouer</button></div><div id="game-over"><h1>Partie terminée</h1><div id="final-score">Score : 0</div><button id="restart-btn">Rejouer</button></div></div><div id="shop-overlay"><div id="shop-header"><h2>Boutique</h2><button id="shop-close" type="button">Fermer</button></div><div id="shop-meta"><div class="pill">Orbes : <span id="shop-orbs">0</span></div><div class="pill">Refresh <span id="shop-timer">10:00</span></div></div><div id="shop-items"></div></div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
import { BGM_URI } from './bgm.js';
const GAME_DURATION=60,PLAYER_SPEED=12,JUMP_FORCE=14,GRAVITY=28,WORLD_SIZE=80,ORB_COUNT=25,OBSTACLE_COUNT=18;
let score=0,orbsCollected=0,timeLeft=GAME_DURATION,gameActive=false,clock=new THREE.Clock(),keys={},velocityY=0,isGrounded=true,joyActive=false,joyDX=0,joyDZ=0,jumpPressed=false;
const bgm=new Audio(BGM_URI);bgm.loop=true;bgm.volume=0.55;
let muted=localStorage.getItem('orbCollector_muted')==='1';
const muteBtn=document.getElementById('mute-btn');
function syncMuteUI(){if(muted){bgm.pause();muteBtn.textContent='🔇';muteBtn.classList.add('muted');}else{muteBtn.textContent='🔊';muteBtn.classList.remove('muted');}localStorage.setItem('orbCollector_muted',muted?'1':'0');}
function startBgm(){if(muted)return;bgm.currentTime=0;bgm.play().catch(()=>{});}
function stopBgm(){bgm.pause();bgm.currentTime=0;}
muteBtn.addEventListener('click',e=>{e.stopPropagation();muted=!muted;if(muted)bgm.pause();else if(gameActive)bgm.play().catch(()=>{});syncMuteUI();});
syncMuteUI();
// shop + game code continues in full version - this is truncated for size, see previous
console.log('Orb Collector loading...');
</script></body></html>
