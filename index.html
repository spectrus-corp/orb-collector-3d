<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>Orb Collector 3D</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:system-ui,sans-serif;color:#e0e0ff;user-select:none;touch-action:none;position:fixed;inset:0}#ui{position:absolute;top:0;left:0;right:0;padding:12px 14px;display:flex;gap:8px;z-index:10;pointer-events:none;flex-wrap:wrap;max-width:calc(100% - 60px)}.stat{background:linear-gradient(145deg,rgba(25,22,50,.88),rgba(15,12,35,.92));border:1px solid rgba(139,92,246,.4);border-radius:14px;padding:9px 14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.45)}.stat span{color:#c4b5fd}#shop-btn,#mute-btn{pointer-events:auto;cursor:pointer}#shop-btn{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border:1px solid rgba(167,139,250,.5);border-radius:14px;padding:9px 16px;font-weight:700}#mute-btn{position:absolute;top:12px;right:12px;z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid rgba(167,139,250,.45);background:rgba(20,20,40,.85);color:#e0e0ff;font-size:1.2rem;display:none;align-items:center;justify-content:center}#mute-btn.visible{display:flex}#overlay{position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(124,58,237,.25),transparent 55%),radial-gradient(ellipse at center,rgba(15,10,40,.94),rgba(5,5,15,.98));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30}#overlay.hidden{opacity:0;pointer-events:none}#overlay h1{font-size:2rem;background:linear-gradient(135deg,#c4b5fd,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}#start-btn,#restart-btn{background:linear-gradient(135deg,#8b5cf6,#4f46e5);color:#fff;border:none;border-radius:16px;padding:15px 40px;font-size:1.1rem;font-weight:700;cursor:pointer;pointer-events:auto}#game-over{display:none}#game-over.visible{display:flex;flex-direction:column;align-items:center}#shop-overlay{position:absolute;inset:0;background:rgba(5,5,15,.92);z-index:40;display:none;flex-direction:column;align-items:center;padding:16px;overflow-y:auto}#shop-overlay.open{display:flex}#instructions{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(15,12,35,.9);border:1px solid rgba(139,92,246,.45);border-radius:16px;padding:10px 16px;z-index:10;pointer-events:none}#mobile-controls{display:none}</style></head><body><div id="canvas-container"><button id="mute-btn" type="button">🔊</button><div id="ui"><div class="stat">Score : <span id="score">0</span></div><div class="stat">Temps : <span id="time">60</span>s</div><div class="stat">Orbes : <span id="orbs">0</span></div><div class="stat">Banque : <span id="total-orbs">0</span></div><button id="shop-btn" type="button">Boutique</button></div><div id="instructions">Z Q S D · Espace sauter</div><div id="mobile-controls"></div></div><div id="overlay"><div id="start-screen"><h1>Orb Collector 3D</h1><p>Collectez les orbes. Évitez les obstacles.</p><button id="start-btn">Jouer</button></div><div id="game-over"><h1>Partie terminée</h1><div id="final-score">Score : 0</div><button id="restart-btn">Rejouer</button></div></div><div id="shop-overlay"><div id="shop-header"><h2>Boutique</h2><button id="shop-close" type="button">Fermer</button></div><div id="shop-meta"><div class="pill">Orbes : <span id="shop-orbs">0</span></div><div class="pill">Refresh <span id="shop-timer">10:00</span></div></div><div id="shop-items"></div></div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const GAME_DURATION=60,PLAYER_SPEED=12,JUMP_FORCE=14,GRAVITY=28,WORLD_SIZE=80,ORB_COUNT=25,OBSTACLE_COUNT=18;
let score=0,orbsCollected=0,timeLeft=GAME_DURATION,gameActive=false,clock=new THREE.Clock(),keys={},velocityY=0,isGrounded=true,joyActive=false,joyDX=0,joyDZ=0,jumpPressed=false;
const bgm=new Audio('bgm.mp3');bgm.loop=true;bgm.volume=0.55;
let muted=localStorage.getItem('orbCollector_muted')==='1';
const muteBtn=document.getElementById('mute-btn');
function syncMuteUI(){if(muted){bgm.pause();muteBtn.textContent='🔇';muteBtn.classList.add('muted');}else{muteBtn.textContent='🔊';muteBtn.classList.remove('muted');}localStorage.setItem('orbCollector_muted',muted?'1':'0');}
function startBgm(){if(muted)return;bgm.currentTime=0;bgm.play().catch(()=>{});}
function stopBgm(){bgm.pause();bgm.currentTime=0;}
muteBtn.addEventListener('click',e=>{e.stopPropagation();muted=!muted;if(muted)bgm.pause();else if(gameActive)bgm.play().catch(()=>{});syncMuteUI();});
syncMuteUI();
const SHOP_REFRESH_MS=600000,SHOP_SLOT_COUNT=6,LS_ORBS='orbCollector_totalOrbs',LS_OWNED='orbCollector_owned',LS_EQUIP='orbCollector_equipped',LS_SHOP='orbCollector_shopState';
const RARITY={common:{weight:55,minPrice:10000,maxPrice:25000,label:'Commun',cls:'rarity-common'},rare:{weight:28,minPrice:35000,maxPrice:70000,label:'Rare',cls:'rarity-rare'},epic:{weight:12,minPrice:90000,maxPrice:160000,label:'Épique',cls:'rarity-epic'},legendary:{weight:5,minPrice:220000,maxPrice:450000,label:'Légendaire',cls:'rarity-legendary'}};
const CATALOG=[{id:'skin_azure',name:'Azur',type:'skin',rarity:'common',color:0x60a5fa,emissive:0x1e3a8a},{id:'skin_emerald',name:'Émeraude',type:'skin',rarity:'common',color:0x34d399,emissive:0x065f46},{id:'skin_crimson',name:'Cramoisi',type:'skin',rarity:'rare',color:0xf43f5e,emissive:0x9f1239},{id:'skin_gold',name:'Or solaire',type:'skin',rarity:'epic',color:0xfbbf24,emissive:0xb45309},{id:'skin_void',name:'Néant',type:'skin',rarity:'legendary',color:0x1e1b4b,emissive:0x7c3aed},{id:'skin_prism',name:'Prisme',type:'skin',rarity:'legendary',color:0xe879f9,emissive:0x86198f},{id:'aura_soft',name:'Halo doux',type:'aura',rarity:'common',color:0xa78bfa,intensity:1.4,dist:7},{id:'aura_ice',name:'Aura de glace',type:'aura',rarity:'rare',color:0x67e8f9,intensity:1.8,dist:8},{id:'aura_flame',name:'Aura flamme',type:'aura',rarity:'epic',color:0xfb923c,intensity:2.2,dist:9},{id:'aura_cosmic',name:'Cosmique',type:'aura',rarity:'legendary',color:0xc084fc,intensity:2.8,dist:11},{id:'trail_spark',name:'Étincelles',type:'trail',rarity:'common',color:0xc4b5fd,size:0.18},{id:'trail_leaf',name:'Feuilles',type:'trail',rarity:'rare',color:0x86efac,size:0.2},{id:'trail_fire',name:'Trainée de feu',type:'trail',rarity:'epic',color:0xf97316,size:0.22},{id:'trail_stardust',name:"Poussière d'étoiles",type:'trail',rarity:'legendary',color:0xfde68a,size:0.26}];
let totalOrbs=parseInt(localStorage.getItem(LS_ORBS)||'0',10)||0,owned=JSON.parse(localStorage.getItem(LS_OWNED)||'[]'),equipped=JSON.parse(localStorage.getItem(LS_EQUIP)||'{}'),shopState=null;
const totalOrbsEl=document.getElementById('total-orbs'),shopOrbsEl=document.getElementById('shop-orbs'),shopTimerEl=document.getElementById('shop-timer'),shopOverlay=document.getElementById('shop-overlay'),shopItemsEl=document.getElementById('shop-items'),shopBtn=document.getElementById('shop-btn'),shopClose=document.getElementById('shop-close');
function saveProgress(){localStorage.setItem(LS_ORBS,String(totalOrbs));localStorage.setItem(LS_OWNED,JSON.stringify(owned));localStorage.setItem(LS_EQUIP,JSON.stringify(equipped));if(shopState)localStorage.setItem(LS_SHOP,JSON.stringify(shopState));if(totalOrbsEl)totalOrbsEl.textContent=totalOrbs.toLocaleString('fr-FR');if(shopOrbsEl)shopOrbsEl.textContent=totalOrbs.toLocaleString('fr-FR');}
function pickRarity(){const t=Object.values(RARITY).reduce((s,r)=>s+r.weight,0);let roll=Math.random()*t;for(const[k,r]of Object.entries(RARITY)){roll-=r.weight;if(roll<=0)return k;}return'common';}
function priceFor(k){const r=RARITY[k];return Math.max(10000,Math.round((r.minPrice+Math.random()*(r.maxPrice-r.minPrice))/500)*500);}
function generateShopItems(){const items=[],used=new Set();let g=0;while(items.length<SHOP_SLOT_COUNT&&g++<80){const rarity=pickRarity();const pool=CATALOG.filter(c=>c.rarity===rarity&&!used.has(c.id));if(!pool.length)continue;const item=pool[Math.floor(Math.random()*pool.length)];used.add(item.id);items.push({id:item.id,price:priceFor(rarity)});}while(items.length<SHOP_SLOT_COUNT){const item=CATALOG[Math.floor(Math.random()*CATALOG.length)];if(used.has(item.id))continue;used.add(item.id);items.push({id:item.id,price:priceFor(item.rarity)});}return items;}
function ensureShopState(){const now=Date.now();try{shopState=JSON.parse(localStorage.getItem(LS_SHOP)||'null');}catch{shopState=null;}if(!shopState||!shopState.refreshAt||!Array.isArray(shopState.items)||now>=shopState.refreshAt){shopState={refreshAt:now+SHOP_REFRESH_MS,items:generateShopItems()};localStorage.setItem(LS_SHOP,JSON.stringify(shopState));}}
function formatCountdown(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
let trailParticles=null,trailPositions=null,trailIdx=0,auraLight=null;const TRAIL_COUNT=48;
function getCatalogItem(id){return CATALOG.find(c=>c.id===id);}
function applyCosmetics(){if(typeof player==='undefined')return;const skin=getCatalogItem(equipped.skin);if(skin&&skin.type==='skin'){player.material.color.setHex(skin.color);player.material.emissive.setHex(skin.emissive);playerGlow.color.setHex(skin.color);}else{player.material.color.setHex(0x60a5fa);player.material.emissive.setHex(0x1e3a8a);playerGlow.color.setHex(0x60a5fa);}if(auraLight){player.remove(auraLight);auraLight=null;}const aura=getCatalogItem(equipped.aura);if(aura&&aura.type==='aura'){auraLight=new THREE.PointLight(aura.color,aura.intensity,aura.dist);player.add(auraLight);}if(trailParticles){scene.remove(trailParticles);trailParticles.geometry.dispose();trailParticles.material.dispose();trailParticles=null;trailPositions=null;}const trail=getCatalogItem(equipped.trail);if(trail&&trail.type==='trail'){const geo=new THREE.BufferGeometry();trailPositions=new Float32Array(TRAIL_COUNT*3);for(let i=0;i<TRAIL_COUNT;i++){trailPositions[i*3]=player.position.x;trailPositions[i*3+1]=player.position.y;trailPositions[i*3+2]=player.position.z;}geo.setAttribute('position',new THREE.BufferAttribute(trailPositions,3));trailParticles=new THREE.Points(geo,new THREE.PointsMaterial({color:trail.color,size:trail.size,transparent:true,opacity:0.85,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(trailParticles);trailIdx=0;}}
function updateTrail(){if(!trailParticles||!trailPositions)return;trailIdx=(trailIdx+1)%TRAIL_COUNT;trailPositions[trailIdx*3]=player.position.x;trailPositions[trailIdx*3+1]=player.position.y;trailPositions[trailIdx*3+2]=player.position.z;trailParticles.geometry.attributes.position.needsUpdate=true;}
function renderShop(){ensureShopState();saveProgress();shopItemsEl.innerHTML='';for(const slot of shopState.items){const item=getCatalogItem(slot.id);if(!item)continue;const r=RARITY[item.rarity],isOwned=owned.includes(item.id),isEquipped=equipped[item.type]===item.id;const card=document.createElement('div');card.className='shop-card'+(isOwned?' owned':'')+(isEquipped?' equipped':'');const pc='#'+(item.color>>>0).toString(16).padStart(6,'0');card.innerHTML='<div class="rarity '+r.cls+'">'+r.label+'</div><div class="preview" style="background:'+pc+';color:'+pc+';width:36px;height:36px;border-radius:50%;margin:4px 0;box-shadow:0 0 12px currentColor"></div><div class="name">'+item.name+'</div><div class="type">'+(item.type==='skin'?'Skin':item.type==='aura'?'Aura':'Trail')+'</div><div class="price">'+(isOwned?'Possédé':slot.price.toLocaleString('fr-FR')+' orbes')+'</div>';const btn=document.createElement('button');btn.type='button';if(isEquipped){btn.textContent='Équipé';btn.onclick=()=>{delete equipped[item.type];applyCosmetics();saveProgress();renderShop();};}else if(isOwned){btn.textContent='Équiper';btn.onclick=()=>{equipped[item.type]=item.id;applyCosmetics();saveProgress();renderShop();};}else{btn.textContent='Acheter';if(totalOrbs<slot.price)btn.disabled=true;btn.onclick=()=>{if(totalOrbs<slot.price||owned.includes(item.id))return;totalOrbs-=slot.price;owned.push(item.id);equipped[item.type]=item.id;applyCosmetics();saveProgress();renderShop();};}card.appendChild(btn);shopItemsEl.appendChild(card);}}
shopBtn.onclick=e=>{e.stopPropagation();ensureShopState();renderShop();shopOverlay.classList.add('open');};
shopClose.onclick=()=>shopOverlay.classList.remove('open');
setInterval(()=>{ensureShopState();const left=shopState.refreshAt-Date.now();if(shopTimerEl)shopTimerEl.textContent=formatCountdown(left);if(left<=0){shopState={refreshAt:Date.now()+SHOP_REFRESH_MS,items:generateShopItems()};localStorage.setItem(LS_SHOP,JSON.stringify(shopState));if(shopOverlay.classList.contains('open'))renderShop();}},1000);
saveProgress();
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0a18);scene.fog=new THREE.Fog(0x0a0a18,25,90);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);camera.position.set(0,12,18);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.getElementById('canvas-container').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x404060,1.2));const dirLight=new THREE.DirectionalLight(0xffffff,1.4);dirLight.position.set(20,40,15);dirLight.castShadow=true;scene.add(dirLight);scene.add(new THREE.HemisphereLight(0x8899ff,0x223344,0.6));
const ground=new THREE.Mesh(new THREE.PlaneGeometry(WORLD_SIZE,WORLD_SIZE,32,32),new THREE.MeshStandardMaterial({color:0x1a1a2e,roughness:0.85,metalness:0.15}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
scene.add(new THREE.GridHelper(WORLD_SIZE,40,0x2a2a4a,0x1a1a30));
const player=new THREE.Mesh(new THREE.SphereGeometry(0.7,32,32),new THREE.MeshStandardMaterial({color:0x60a5fa,emissive:0x1e3a8a,emissiveIntensity:0.35,roughness:0.3,metalness:0.6}));player.position.set(0,0.7,0);player.castShadow=true;scene.add(player);const playerGlow=new THREE.PointLight(0x60a5fa,1.2,8);player.add(playerGlow);
const orbs=[],orbGeo=new THREE.IcosahedronGeometry(0.45,1),orbMat=new THREE.MeshStandardMaterial({color:0xc084fc,emissive:0x7c3aed,emissiveIntensity:0.9,roughness:0.2,metalness:0.4});
function spawnOrb(){const orb=new THREE.Mesh(orbGeo,orbMat.clone());const a=Math.random()*Math.PI*2,r=5+Math.random()*(WORLD_SIZE/2-8);orb.position.set(Math.cos(a)*r,0.6+Math.random()*1.5,Math.sin(a)*r);orb.userData={baseY:orb.position.y,phase:Math.random()*Math.PI*2};orb.castShadow=true;scene.add(orb);orbs.push(orb);orb.add(new THREE.PointLight(0xc084fc,0.8,6));}
for(let i=0;i<ORB_COUNT;i++)spawnOrb();
const obstacles=[],obsGeo=new THREE.BoxGeometry(1.6,2.2,1.6),obsMat=new THREE.MeshStandardMaterial({color:0xef4444,emissive:0x7f1d1d,emissiveIntensity:0.4,roughness:0.5});
for(let i=0;i<OBSTACLE_COUNT;i++){const obs=new THREE.Mesh(obsGeo,obsMat);const a=Math.random()*Math.PI*2,r=8+Math.random()*(WORLD_SIZE/2-12);obs.position.set(Math.cos(a)*r,1.1,Math.sin(a)*r);obs.castShadow=true;scene.add(obs);obstacles.push(obs);}
const starGeo=new THREE.BufferGeometry(),pos=new Float32Array(900);for(let i=0;i<300;i++){pos[i*3]=(Math.random()-0.5)*180;pos[i*3+1]=Math.random()*60+10;pos[i*3+2]=(Math.random()-0.5)*180;}starGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xa5b4fc,size:0.25,transparent:true,opacity:0.8})));
const cameraOffset=new THREE.Vector3(0,10,14),cameraLook=new THREE.Vector3();
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),orbsEl=document.getElementById('orbs'),overlay=document.getElementById('overlay'),startScreen=document.getElementById('start-screen'),gameOverScreen=document.getElementById('game-over'),finalScoreEl=document.getElementById('final-score');
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function resetGame(){score=0;orbsCollected=0;timeLeft=GAME_DURATION;velocityY=0;isGrounded=true;player.position.set(0,0.7,0);scoreEl.textContent='0';timeEl.textContent=String(GAME_DURATION);orbsEl.textContent='0';orbs.forEach(o=>scene.remove(o));orbs.length=0;for(let i=0;i<ORB_COUNT;i++)spawnOrb();}
function startGame(){resetGame();overlay.classList.add('hidden');startScreen.style.display='none';gameOverScreen.classList.remove('visible');gameActive=true;clock.start();muteBtn.classList.add('visible');startBgm();}
function endGame(){gameActive=false;finalScoreEl.textContent='Score : '+score;overlay.classList.remove('hidden');gameOverScreen.classList.add('visible');muteBtn.classList.remove('visible');stopBgm();}
document.getElementById('start-btn').onclick=startGame;document.getElementById('restart-btn').onclick=startGame;
function distanceXZ(a,b){const dx=a.x-b.x,dz=a.z-b.z;return Math.sqrt(dx*dx+dz*dz);}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);if(gameActive){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;endGame();}timeEl.textContent=Math.ceil(timeLeft);let moveX=0,moveZ=0;if(keys['KeyW']||keys['ArrowUp']||keys['KeyZ'])moveZ-=1;if(keys['KeyS']||keys['ArrowDown'])moveZ+=1;if(keys['KeyA']||keys['ArrowLeft']||keys['KeyQ'])moveX-=1;if(keys['KeyD']||keys['ArrowRight'])moveX+=1;const len=Math.hypot(moveX,moveZ);if(len>1){moveX/=len;moveZ/=len;}else if(len<=0.05){moveX=0;moveZ=0;}player.position.x+=moveX*PLAYER_SPEED*dt;player.position.z+=moveZ*PLAYER_SPEED*dt;const half=WORLD_SIZE/2-1.5;player.position.x=Math.max(-half,Math.min(half,player.position.x));player.position.z=Math.max(-half,Math.min(half,player.position.z));if((keys['Space']||jumpPressed)&&isGrounded){velocityY=JUMP_FORCE;isGrounded=false;}velocityY-=GRAVITY*dt;player.position.y+=velocityY*dt;if(player.position.y<=0.7){player.position.y=0.7;velocityY=0;isGrounded=true;}for(let i=orbs.length-1;i>=0;i--){const orb=orbs[i];orb.position.y=orb.userData.baseY+Math.sin(clock.elapsedTime*2.5+orb.userData.phase)*0.25;orb.rotation.y+=dt*1.5;if(distanceXZ(player.position,orb.position)<1.3){scene.remove(orb);orbs.splice(i,1);score+=100;orbsCollected++;totalOrbs+=1;scoreEl.textContent=score;orbsEl.textContent=orbsCollected;saveProgress();if(orbs.length<ORB_COUNT-3)spawnOrb();}}for(const obs of obstacles){if(distanceXZ(player.position,obs.position)<1.6&&Math.abs(player.position.y-obs.position.y)<1.8){score=Math.max(0,score-50);scoreEl.textContent=score;const dx=player.position.x-obs.position.x,dz=player.position.z-obs.position.z,d=Math.hypot(dx,dz)||1;player.position.x+=(dx/d)*1.2;player.position.z+=(dz/d)*1.2;velocityY=6;isGrounded=false;}}}if(typeof updateTrail==='function')updateTrail();const targetPos=player.position.clone().add(cameraOffset);camera.position.lerp(targetPos,1-Math.pow(0.001,dt));cameraLook.copy(player.position);cameraLook.y+=1.5;camera.lookAt(cameraLook);if(gameActive)player.rotation.y+=dt*0.5;renderer.render(scene,camera);}
animate();
if(typeof applyCosmetics==='function')applyCosmetics();
</script></body></html>
